name: Test-airflow

on:
  push:
    branches:
      - main
      - dev
      - dev-airflow
  pull_request:
    branches:
      - main
      - dev

jobs:
  unit-validators:
    name: Unit tests (validators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run validators tests
        run: pytest tests/test_validators.py -v